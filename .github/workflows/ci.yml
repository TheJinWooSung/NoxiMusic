name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg (required by the runtime check)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project + dev tools
        run: uv pip install --system -e ".[dev]"

      - name: Ruff
        run: ruff check noxy tests

      - name: Tests
        run: pytest -q
        env:
          API_ID: "12345"
          API_HASH: "0123456789abcdef0123456789abcdef"
          BOT_TOKEN: "12345:AAFakeTokenForTests"
          MONGO_URI: "mongodb://localhost:27017/noximusic"
          OWNER_ID: "1"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
