services:
  noximusic:
    build:
      context: .
      dockerfile: Dockerfile
    image: noximusic:${TAG:-latest}
    container_name: noximusic
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads
      - ./cache:/app/cache
      - ./playback:/app/playback
      - ./noxy/cookies:/app/noxy/cookies
    deploy:
      resources:
        limits:
          memory: 1g
    stop_grace_period: 20s
    network_mode: host

  restarter:
    image: docker:cli
    profiles: ["watchdog"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["/bin/sh", "-c", "while true; do sleep 18000; docker restart noximusic; done"]
    restart: unless-stopped
    network_mode: host
